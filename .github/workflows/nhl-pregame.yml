
name: NHL Pregame Monitor

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NHL monitor
        run: python3 monitor.py

      - name: Check OddsPapi account
        if: github.event_name == 'workflow_dispatch'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode({
              "apiKey": os.environ["ODDSPAPI_API_KEY"]
          })

          url = "https://api.oddspapi.io/v4/account?" + params

          with urllib.request.urlopen(url, timeout=20) as response:
              json.load(response)

          print("OddsPapi account connection successful")
          PY

      - name: Find NHL fixtures
        if: github.event_name == 'workflow_dispatch'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          end = now + timedelta(hours=12)

          params = urllib.parse.urlencode({
              "apiKey": os.environ["ODDSPAPI_API_KEY"],
              "sportId": 15,
              "from": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "to": end.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "statusId": 0,
              "hasOdds": "true",
              "bookmakers": "pinnacle"
          })

          url = "https://api.oddspapi.io/v4/fixtures?" + params

          with urllib.request.urlopen(url, timeout=20) as response:
              fixtures = json.load(response)

          print("Ice hockey fixtures found:", len(fixtures))

          tournament_ids = set()

          for fixture in fixtures[:30]:
              tournament_id = fixture.get("tournamentId")
              tournament_ids.add(tournament_id)

              print(
                  "Tournament ID:", tournament_id,
                  "| Fixture ID:", fixture.get("fixtureId"),
                  "| Start:", fixture.get("startTime")
              )

          print("Tournament IDs:", sorted(
              str(x) for x in tournament_ids if x is not None
          ))
          print("NHL tournament identification still required.")
          PY
