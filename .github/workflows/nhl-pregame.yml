
name: NHL Pregame Monitor

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NHL monitor
        run: python3 monitor.py

      - name: Identify NHL tournament
        if: github.event_name == 'workflow_dispatch'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode({
              "apiKey": os.environ["ODDSPAPI_API_KEY"],
              "sportId": 15,
              "language": "en"
          })

          url = "https://api.oddspapi.io/v4/tournaments?" + params

          with urllib.request.urlopen(url, timeout=20) as response:
              tournaments = json.load(response)

          target_ids = {234, 844, 1159, 14361}

          print("Matching tournament information:")

          for tournament in tournaments:
              tournament_id = tournament.get("tournamentId")
              name = tournament.get("tournamentName", "")
              category = tournament.get("categoryName", "")

              if tournament_id in target_ids or name.strip().upper() == "NHL":
                  print(
                      "ID:", tournament_id,
                      "| League:", name,
                      "| Category:", category
                  )

          print("Tournament lookup complete")
          PY
