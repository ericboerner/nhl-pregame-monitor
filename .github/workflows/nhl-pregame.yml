
name: NHL Pregame Monitor

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NHL monitor
        run: python3 monitor.py

      - name: Inspect Pinnacle NHL markets
        if: github.event_name == 'workflow_dispatch'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          key = os.environ["ODDSPAPI_API_KEY"]
          now = datetime.now(timezone.utc)
          end = now + timedelta(hours=12)

          def request(path, params):
              query = urllib.parse.urlencode({
                  **params,
                  "apiKey": key
              })
              url = "https://api.oddspapi.io" + path + "?" + query
              with urllib.request.urlopen(url, timeout=25) as response:
                  return json.load(response)

          fixtures = request("/v4/fixtures", {
              "tournamentId": 234,
              "from": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "to": end.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "statusId": 0,
              "hasOdds": "true",
              "bookmakers": "pinnacle"
          })

          print("Upcoming NHL fixtures:", len(fixtures))

          if not fixtures:
              print("No NHL fixtures available for this test.")
          else:
              fixture = fixtures[0]
              fixture_id = fixture["fixtureId"]

              print("Fixture ID:", fixture_id)
              print("Start:", fixture.get("startTime"))

              odds = request("/v4/odds", {
                  "fixtureId": fixture_id,
                  "bookmakers": "pinnacle",
                  "oddsFormat": "decimal",
                  "language": "en",
                  "verbosity": 2
              })

              pinnacle = odds.get("bookmakerOdds", {}).get("pinnacle")

              if pinnacle is None:
                  print("No Pinnacle odds returned.")
              else:
                  print("Pinnacle data type:", type(pinnacle).__name__)

                  if isinstance(pinnacle, dict):
                      print("Pinnacle top-level keys:", list(pinnacle.keys()))

                      for section, value in pinnacle.items():
                          print("Section:", section)
                          print("Data type:", type(value).__name__)

                          if isinstance(value, dict):
                              print("Keys:", list(value.keys())[:30])
                          elif isinstance(value, list):
                              print("Number of items:", len(value))

                              for item in value[:3]:
                                  if isinstance(item, dict):
                                      print("Item keys:", list(item.keys()))
                                      for field in (
                                          "marketName", "marketId",
                                          "name", "label", "type"
                                      ):
                                          if field in item:
                                              print(field + ":", item[field])
                                  else:
                                      print("Item type:", type(item).__name__)

                  elif isinstance(pinnacle, list):
                      print("Number of Pinnacle entries:", len(pinnacle))
                      for item in pinnacle[:5]:
                          if isinstance(item, dict):
                              print("Entry keys:", list(item.keys()))

                  print("Market inspection complete")
          PY
