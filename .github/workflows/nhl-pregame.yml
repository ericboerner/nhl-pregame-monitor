
name: NHL Pregame Monitor

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NHL monitor
        run: python3 monitor.py

      - name: Test Pinnacle NHL odds
        if: github.event_name == 'workflow_dispatch'
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          key = os.environ["ODDSPAPI_API_KEY"]
          now = datetime.now(timezone.utc)
          end = now + timedelta(hours=12)

          def request(path, params):
              params["apiKey"] = key
              query = urllib.parse.urlencode(params)
              url = "https://api.oddspapi.io" + path + "?" + query
              with urllib.request.urlopen(url, timeout=25) as response:
                  return json.load(response)

          fixtures = request("/v4/fixtures", {
              "tournamentId": 234,
              "from": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "to": end.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "statusId": 0,
              "hasOdds": "true",
              "bookmakers": "pinnacle"
          })

          print("NHL fixtures found:", len(fixtures))

          if not fixtures:
              print("No qualifying NHL fixtures in next 12 hours.")
          else:
              fixture = fixtures[0]
              fixture_id = fixture["fixtureId"]

              print("Testing fixture:", fixture_id)
              print("Start:", fixture.get("startTime"))

              odds = request("/v4/odds", {
                  "fixtureId": fixture_id,
                  "bookmakers": "pinnacle",
                  "oddsFormat": "decimal",
                  "language": "en",
                  "verbosity": 2
              })

              print("Odds response received")
              print("Top-level fields:", list(odds.keys()))

              for key_name, value in odds.items():
                  if isinstance(value, dict):
                      print(
                          "Section:", key_name,
                          "| Keys:", list(value.keys())[:20]
                      )
                  elif isinstance(value, list):
                      print(
                          "Section:", key_name,
                          "| Items:", len(value)
                      )

              print("Market structure inspection complete")
          PY
